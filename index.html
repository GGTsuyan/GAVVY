<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GAVVY — Our Private Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Supabase JavaScript Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <nav class="topbar">
      <div class="brand">◆ GAVVY</div>
      <div class="nav-actions">
        <button data-route="home" class="nav-btn active">Home</button>
        <button data-route="memories" class="nav-btn">Memories</button>
        <button data-route="calendar" class="nav-btn">Calendar</button>
        <button data-route="notes" class="nav-btn">Notes</button>
        <button data-route="ideas" class="nav-btn">Ideas</button>
        <button data-route="period" class="nav-btn">Period</button>
        <button data-route="trips" class="nav-btn">Trips</button>
        <button data-route="us" class="nav-btn">Us</button>
      </div>
    </nav>

    <main id="app" class="app">
      <div class="center">Loading…</div>
    </main>

    <!-- Supabase Configuration -->
    <script src="supabase.config.js"></script>
    
    <!-- Supabase Database Service Layer -->
    <script src="supabase-client.js"></script>
    
    <!-- Migration Helper (optional) -->
    <script src="migrate-to-supabase.js"></script>
    
    <!-- Main Application Script -->
    <script src="script.js" defer></script>

</html>
